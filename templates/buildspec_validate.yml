version: 0.2

env:
  variables:
    CODE_SRC_DIR: "."
    SCRIPT_DIR: "./templates/scripts"
    
    # Terraform related variables
    TF_MODULE_TO_BUILD: "network"
    TF_VERSION: "1.4.6"
    ENVIRONMENT: "demo"
    SKIPVALIDATIONFAILURE: "N"
    ENABLE_TFVALIDATE: "Y"
    ENABLE_TFFORMAT: "Y"
    ENABLE_TFCHECKOV: "Y"
    ENABLE_TFSEC: "Y"
    TFSEC_VERSION: "v1.28.1"
    CHECKOV_VERSION: "3.2.255"

phases:
  install:
    runtime-versions:
      python: 3.9
      golang: 1.14
    commands:
      - set -e
      # Install Terraform
      - "echo Installing Terraform..."
      - "curl -sSfL -o terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - "curl -sSfL -o terraform_SHA256SUMS https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS"
      - "grep \"terraform_${TF_VERSION}_linux_amd64.zip\" terraform_SHA256SUMS | sed 's/terraform_.*_linux_amd64.zip/terraform.zip/' | sha256sum -c -"
      - "unzip -o terraform.zip"
      - "mv terraform /bin"
      - "rm terraform.zip"

      # Install necessary utilities
      - "yum install -y curl jq awscli"
      - "pip3 install checkov==${CHECKOV_VERSION}"
      
      # Install TFSec
      - "curl -sSfL -o tfsec https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
      - "curl -sSfL -o tfsec_checksums.txt https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec_checksums.txt"
      - "grep ' tfsec-linux-amd64$' tfsec_checksums.txt | sed 's/tfsec-linux-amd64/tfsec/' | sha256sum -c -"
      - "chmod +x ./tfsec"
      - "mv ./tfsec /usr/local/bin/tfsec"

  build:
    commands:
      - set -e
      - "echo ## TERRAFORM INIT : Initialize the Terraform Workspace"
      - "/bin/bash ${CODEBUILD_SRC_DIR}/run.sh -m ${TF_MODULE_TO_BUILD} -e ${ENVIRONMENT} -r ${AWS_REGION} -t init"
      - "cd ${CODEBUILD_SRC_DIR}/${ENVIRONMENT}/${TF_MODULE_TO_BUILD}"

      # Validation
      - "echo ## VALIDATION : Starting ..."
      - "mkdir -p ${CODEBUILD_SRC_DIR}/reports"
      - "/bin/bash ${CODEBUILD_SRC_DIR}/${SCRIPT_DIR}/tf_ssp_validation.sh ${SKIPVALIDATIONFAILURE} ${ENABLE_TFVALIDATE} ${ENABLE_TFFORMAT} ${ENABLE_TFCHECKOV} ${ENABLE_TFSEC}"
      - "cp checkov.xml ${CODEBUILD_SRC_DIR}/reports/checkov.xml"
      - "cp tfsec-junit.xml ${CODEBUILD_SRC_DIR}/reports/tfsec-junit.xml"

artifacts:
  files:
    - '**/*'

reports:
  checkov-reports:
    files:
      - "./reports/checkov.xml"
    file-format: "JUNITXML"
  
  tfsec-reports:
    files:
      - "./reports/tfsec-junit.xml"
    file-format: "JUNITXML"

